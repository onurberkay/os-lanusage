{% if helpers.exists('OPNsense.hostguard.general') %}
{%   set g = OPNsense.hostguard.general %}
[general]
enabled={{ g.enabled|default('0') }}
interfaces={{ g.interfaces|default('') }}
networks={{ g.networks|default('') }}
ignore_self={{ g.ignore_self|default('1') }}
answered_only={{ g.answered_only|default('1') }}
track_remote={{ g.track_remote|default('1') }}
poll_interval={{ g.poll_interval|default('30') }}
retention_days={{ g.retention_days|default('30') }}
probe_enabled={{ g.probe_enabled|default('1') }}
probe_interval={{ g.probe_interval|default('24') }}
probe_timeout={{ g.probe_timeout|default('4') }}
probe_max={{ g.probe_max|default('20') }}
probe_exclude={{ g.probe_exclude|default('') }}
use_nmap={{ g.use_nmap|default('0') }}
lateral_alerts={{ g.lateral_alerts|default('all') }}
lateral_trusted={{ g.lateral_trusted|default('') }}
lateral_blocked={{ g.lateral_blocked|default('0') }}
sample_enabled={{ g.sample_enabled|default('1') }}
sample_interfaces={{ g.sample_interfaces|default('') }}
sample_seconds={{ g.sample_seconds|default('5') }}
sample_packets={{ g.sample_packets|default('20000') }}
blocked_out_pps={{ g.blocked_out_pps|default('20') }}
blocked_in_pps={{ g.blocked_in_pps|default('500') }}
rule_block_pps={{ g.rule_block_pps|default('2000') }}
scan_hosts={{ g.scan_hosts|default('10') }}
scan_ports={{ g.scan_ports|default('20') }}
l2_enabled={{ g.l2_enabled|default('1') }}
l2_window={{ g.l2_window|default('24') }}
l2_ignore_macs={{ g.l2_ignore_macs|default('') }}
l2_source={{ g.l2_source|default('both') }}
host_state_limit={{ g.host_state_limit|default('10000') }}
host_rate_limit={{ g.host_rate_limit|default('300') }}
state_warn_pct={{ g.state_warn_pct|default('80') }}
watch_tables={{ g.watch_tables|default('') }}
shaper_drop_pps={{ g.shaper_drop_pps|default('5') }}
attack_pps={{ g.attack_pps|default('50') }}
ids_enabled={{ g.ids_enabled|default('1') }}
crowdsec_enabled={{ g.crowdsec_enabled|default('1') }}
ipdata_enabled={{ g.ipdata_enabled|default('1') }}
hosting_asns={{ g.hosting_asns|default('') }}
auto_block_level={{ g.auto_block_level|default('0') }}
auto_block_hours={{ g.auto_block_hours|default('24') }}
auto_block_ban={{ g.auto_block_ban|default('fixed') }}
auto_block_max_hours={{ g.auto_block_max_hours|default('720') }}
{% else %}
[general]
enabled=0
interfaces=lan
{% endif %}
