[start]
command:/usr/local/etc/rc.d/hostguard start
parameters:
type:script
message:starting HostGuard collector

[stop]
command:/usr/local/etc/rc.d/hostguard onestop
parameters:
type:script
message:stopping HostGuard collector

[restart]
command:/usr/local/etc/rc.d/hostguard onestop; /usr/local/etc/rc.d/hostguard start
parameters:
type:script
message:restarting HostGuard collector

[reload]
command:/usr/local/etc/rc.d/hostguard onestop; /usr/local/etc/rc.d/hostguard start
parameters:
type:script
message:reloading HostGuard collector

[status]
command:/usr/local/etc/rc.d/hostguard onestatus; exit 0
parameters:
type:script_output
message:request HostGuard collector status

[query]
command:/usr/local/opnsense/scripts/OPNsense/HostGuard/query.py
parameters:%s %s %s %s
type:script_output

[probe]
command:/usr/local/opnsense/scripts/OPNsense/HostGuard/probe.py
parameters:%s %s %s
type:script_output
message:HostGuard service test

[update_ipdata]
command:/usr/sbin/daemon -f /usr/local/opnsense/scripts/OPNsense/HostGuard/update_ipdata.py force
parameters:
type:script
message:HostGuard update outside source lists

[clear]
command:/usr/local/opnsense/scripts/OPNsense/HostGuard/query.py clear
parameters:
type:script_output
message:HostGuard clear collected data
