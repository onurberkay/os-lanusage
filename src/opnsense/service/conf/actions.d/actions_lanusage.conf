[start]
command:/usr/local/etc/rc.d/lanusage start
parameters:
type:script
message:starting LAN usage collector

[stop]
command:/usr/local/etc/rc.d/lanusage onestop
parameters:
type:script
message:stopping LAN usage collector

[restart]
command:/usr/local/etc/rc.d/lanusage onestop; /usr/local/etc/rc.d/lanusage start
parameters:
type:script
message:restarting LAN usage collector

[reload]
command:/usr/local/etc/rc.d/lanusage onestop; /usr/local/etc/rc.d/lanusage start
parameters:
type:script
message:reloading LAN usage collector

[status]
command:/usr/local/etc/rc.d/lanusage onestatus; exit 0
parameters:
type:script_output
message:request LAN usage collector status

[query]
command:/usr/local/opnsense/scripts/OPNsense/LanUsage/query.py
parameters:%s %s %s %s
type:script_output

[probe]
command:/usr/local/opnsense/scripts/OPNsense/LanUsage/probe.py
parameters:%s %s %s
type:script_output
message:LAN usage service test

[clear]
command:/usr/local/opnsense/scripts/OPNsense/LanUsage/query.py clear
parameters:
type:script_output
message:LAN usage clear collected data
